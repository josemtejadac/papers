<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab · Papers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ --reader-font:17px; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  background: radial-gradient(rgba(50,46,34,0.10) 1px, transparent 1.4px) 0 0/22px 22px, #e9e3d3;
  display:flex; align-items:flex-start; justify-content:center; min-height:100vh;
}
#phone{
  --bg:#e9e3d3; --paper:#fbf8f0; --paper-2:#f3efe2; --ink:#211f1a; --ink-soft:#4b473d; --muted:#83795f;
  --line:#cfc4a4; --accent:#3f5d46; --accent-soft:#e4e9df; --wax:#a13a2c; --wax-soft:#f3ddd6;
  --amber:#b8842c; --amber-soft:#f2e5c9; --shadow:0 18px 34px rgba(33,31,26,0.16);
  --border-w:1px;
  position:relative; width:100%; max-width:430px; height:100dvh;
  background:var(--paper); overflow:hidden; isolation:isolate; color:var(--ink);
  font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
}
#phone[data-theme="negro"]{
  --bg:#141310; --paper:#1e1c17; --paper-2:#26241d; --ink:#efe9da; --ink-soft:#c9c2ac; --muted:#8d8570;
  --line:#3c392c; --accent:#8fbf93; --accent-soft:#233327; --wax:#e2685a; --wax-soft:#3a2420;
  --amber:#e0ac52; --amber-soft:#3a2f18; --shadow:0 18px 34px rgba(0,0,0,0.55);
}
#phone[data-theme="alto-contraste"]{
  --bg:#ffffff; --paper:#ffffff; --paper-2:#ffffff; --ink:#000000; --ink-soft:#000000; --muted:#000000;
  --line:#000000; --accent:#000000; --accent-soft:#fff066; --wax:#000000; --wax-soft:#fff066;
  --amber:#000000; --amber-soft:#fff066; --shadow:none; --border-w:2px;
}
#phone[data-theme="alto-contraste"] .icon-btn.heart.active svg{ fill:#000; }
#phone[data-theme="alto-contraste"] .btn-primary{ background:#000; color:#fff066; }
@media (min-width:560px){
  body{ padding:34px 16px; }
  #phone{ height:860px; border-radius:34px; box-shadow:var(--shadow); border:1px solid rgba(33,31,26,0.14); }
}
.font-serif{ font-family:'Lora','Iowan Old Style',Georgia,serif; }
.font-mono{ font-family:'IBM Plex Mono','SF Mono',Consolas,monospace; }

#screens{ position:absolute; inset:0; bottom:64px; overflow:hidden; }
.screen{ position:absolute; inset:0; overflow-y:auto; display:none; flex-direction:column; -webkit-overflow-scrolling:touch;}
.screen.active{ display:flex; }
.stage{ position:absolute; inset:0; z-index:25; background:var(--paper); display:none; flex-direction:column; }
.stage.active{ display:flex; }

.topbar{ padding:18px 20px 12px; display:flex; align-items:baseline; justify-content:space-between; border-bottom:var(--border-w) solid var(--line); background:var(--paper); flex:0 0 auto;}
.wordmark{ font-family:'Lora',serif; font-style:italic; font-weight:600; font-size:22px;}
.topbar .helptext{ font-size:12px; color:var(--muted); max-width:150px; text-align:right; line-height:1.35;}
.screen-title{ font-family:'Lora',serif; font-weight:600; font-size:21px; }

#tabbar{ position:absolute; left:0; right:0; bottom:0; height:64px; background:var(--paper); border-top:var(--border-w) solid var(--line); display:flex; z-index:5; box-shadow:0 -8px 18px rgba(33,31,26,0.10);}
.tab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:none; border:none; color:var(--muted); font-size:11px; cursor:pointer; padding:6px 0 8px;}
.tab svg{ width:21px; height:21px; }
.tab .icon-wrap{ position:relative; padding:4px 12px; border-radius:10px; }
.tab.active{ color:var(--accent); }
.tab.active .icon-wrap{ background:var(--accent-soft); }
.tab-badge{ position:absolute; top:-3px; right:2px; min-width:15px; height:15px; padding:0 3px; border-radius:8px; background:var(--wax); color:#fff; font-size:9.5px; font-weight:600; display:none; align-items:center; justify-content:center; }
.tab-badge.show{ display:flex; }
.tab .dot{ position:absolute; top:1px; right:5px; width:7px; height:7px; border-radius:50%; background:var(--wax); display:none; }
.tab .dot.show{ display:block; }
svg.icon{ display:block; }
.icon-outline{ fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

/* ---------- login / survey ---------- */
.stage-content{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:30px 30px 60px; }
.stage-content.top{ justify-content:flex-start; padding-top:50px; }
.login-mark{ font-family:'Lora',serif; font-style:italic; font-weight:600; font-size:40px; text-align:center; margin-bottom:6px;}
.login-tag{ text-align:center; color:var(--muted); font-size:14px; margin-bottom:46px; line-height:1.5;}
.btn-block{ width:100%; padding:14px; border-radius:10px; border:var(--border-w) solid var(--line); background:var(--paper); font-size:14.5px; font-weight:600; color:var(--ink); margin-bottom:12px; display:flex; align-items:center; justify-content:center; gap:9px;}
.btn-block.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-block.ghost{ background:none; border:none; color:var(--accent); font-weight:500; }
.survey-title{ font-family:'Lora',serif; font-size:22px; font-weight:600; padding:24px 24px 4px;}
.survey-sub{ font-size:13.5px; color:var(--muted); padding:0 24px 20px; line-height:1.5;}
.survey-grid{ display:flex; flex-wrap:wrap; gap:9px; padding:0 24px 24px; }
.survey-footer{ margin-top:auto; padding:16px 24px 26px; border-top:var(--border-w) solid var(--line); }
.survey-count{ font-size:12px; color:var(--muted); padding:0 24px 6px; }

/* ---------- deck ---------- */
#deck-wrap{ flex:1; position:relative; padding:18px 20px 10px; min-height:0;}
#deck{ position:absolute; top:18px; left:20px; right:20px; bottom:74px; }
.card{ position:absolute; inset:0; background:var(--paper-2); border:var(--border-w) solid var(--line); border-radius:10px; padding:0; display:flex; flex-direction:column; box-shadow:0 10px 22px rgba(33,31,26,0.10); touch-action:pan-y; will-change:transform; -webkit-user-select:none; user-select:none;}
.card *{ touch-action:pan-y; }
.card.idle-nudge{ animation:idleNudge 1.1s cubic-bezier(.2,.7,.3,1); }
@keyframes idleNudge{
  0%{ transform:translateX(0) rotate(0); }
  35%{ transform:translateX(22px) rotate(4deg); }
  60%{ transform:translateX(-6px) rotate(-1deg); }
  100%{ transform:translateX(0) rotate(0); }
}
.card .perf{ height:12px; border-bottom:1px dashed var(--line); flex:0 0 auto; background-image:radial-gradient(circle at 10px 6px, var(--paper) 3px, transparent 3px), radial-gradient(circle at 26px 6px, var(--paper) 3px, transparent 3px);}
.card-scroll{ flex:1; overflow-y:auto; padding:16px 18px 8px; min-height:0;}
.card .section-label{ font-size:11.5px; color:var(--accent); font-weight:600; margin:0 0 6px; }
.card h2{ font-family:'Lora',serif; font-weight:600; font-size:20px; line-height:1.28; margin:0 0 10px;}
.card .authors{ font-size:13px; color:var(--ink-soft); margin:0 0 3px;}
.card .doi{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted); margin:0 0 2px; word-break:break-all;}
.card .cited{ font-size:11.5px; color:var(--muted); margin:0 0 12px;}
.kw-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
.kw{ font-size:11.5px; padding:4px 9px; border:var(--border-w) solid var(--line); border-radius:100px; color:var(--ink-soft); background:var(--paper);}
.card .abstract{ font-family:'Lora',serif; font-size:15px; line-height:1.55; color:var(--ink);}
.card-footer{ flex:0 0 auto; display:flex; justify-content:flex-end; gap:8px; padding:10px 14px 14px; border-top:var(--border-w) solid var(--line);}
.icon-btn{ width:40px; height:40px; border-radius:9px; border:var(--border-w) solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); cursor:pointer;}
.icon-btn:active{ background:var(--paper-2); }
.icon-btn.heart.active{ color:var(--wax); border-color:var(--wax-soft); background:var(--wax-soft); }
.icon-btn.heart.active svg{ fill:var(--wax); }
#deck-nav{ position:absolute; left:20px; right:20px; bottom:12px; height:48px; display:flex; align-items:center; justify-content:center; gap:18px; }
#deck-nav button{ width:36px; height:36px; border-radius:50%; border:var(--border-w) solid var(--line); background:var(--paper); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;}
#deck-nav button[disabled]{ opacity:.35; }
#deck-nav .counter{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); min-width:44px; text-align:center;}

/* ---------- library ---------- */
.folder-tabs{ display:flex; gap:8px; padding:12px 20px; overflow-x:auto; flex:0 0 auto; border-bottom:var(--border-w) solid var(--line);}
.folder-chip{ flex:0 0 auto; font-size:13px; padding:8px 14px; border-radius:100px; border:var(--border-w) solid var(--line); background:var(--paper); color:var(--ink-soft); white-space:nowrap; cursor:pointer; display:flex; align-items:center; gap:6px;}
.folder-chip.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
.folder-chip.add{ color:var(--accent); }
.list{ padding:8px 14px 26px; display:flex; flex-direction:column; gap:2px; }
.row-item{ display:flex; gap:12px; align-items:flex-start; padding:14px 8px; border-bottom:var(--border-w) solid var(--line); cursor:pointer;}
.row-thumb{ position:relative; flex:0 0 auto; width:46px; height:58px; background:var(--paper-2); border:var(--border-w) solid var(--line); border-radius:5px; display:flex; align-items:center; justify-content:center;}
.row-thumb .mono{ font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); }
.row-thumb .offline-badge{ position:absolute; bottom:-5px; right:-5px; width:18px; height:18px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; border:2px solid var(--paper);}
.row-thumb .offline-badge svg{ width:11px; height:11px; }
.row-body h3{ font-family:'Lora',serif; font-size:15.5px; font-weight:600; margin:0 0 3px; line-height:1.3;}
.row-body .meta{ font-size:12px; color:var(--muted); }
.row-body .meta .mono{ font-family:'IBM Plex Mono',monospace; }
.empty-state{ margin:auto; text-align:center; padding:40px 30px; color:var(--muted); font-size:14px; line-height:1.5;}

/* ---------- social feed ---------- */
.dm-btn{ position:relative; width:38px; height:38px; border-radius:10px; border:var(--border-w) solid var(--line); background:var(--paper); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;}
.dm-badge{ position:absolute; top:-6px; right:-6px; min-width:16px; height:16px; padding:0 3px; border-radius:8px; background:var(--wax); color:#fff; font-size:9.5px; font-weight:600; display:none; align-items:center; justify-content:center;}
.dm-badge.show{ display:flex; }
.post-card{ padding:16px 20px; border-bottom:var(--border-w) solid var(--line); }
.post-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.post-author .n{ font-size:14px; font-weight:600; }
.post-author .s{ font-size:12px; color:var(--muted); }
.post-text{ font-size:14.5px; line-height:1.5; margin-bottom:10px; }
.post-quoted{ font-size:13px; color:var(--ink-soft); background:var(--paper-2); border:var(--border-w) solid var(--line); border-radius:9px; padding:9px 12px; margin-bottom:10px;}
.post-paper{ background:var(--paper-2); border:var(--border-w) solid var(--line); border-radius:9px; padding:11px 13px; margin-bottom:10px; cursor:pointer;}
.post-paper .pp-label{ font-size:11px; color:var(--accent); font-weight:600; margin-bottom:3px;}
.post-paper h4{ font-family:'Lora',serif; font-size:14px; font-weight:600; margin:0 0 3px; line-height:1.3;}
.post-paper .pp-meta{ font-size:11.5px; color:var(--muted); }
.post-actions{ display:flex; gap:22px; }
.post-act{ display:flex; align-items:center; gap:6px; border:none; background:none; color:var(--muted); font-size:12.5px; padding:4px 0; cursor:pointer;}
.post-act svg{ width:18px; height:18px; }
.post-act.like.active{ color:var(--wax); }
.post-act.like.active svg{ fill:var(--wax); }

/* ---------- chat (DM thread, se mantiene) ---------- */
.new-convo-btn{ width:34px; height:34px; border-radius:9px; border:var(--border-w) solid var(--line); background:var(--paper); color:var(--accent); display:flex; align-items:center; justify-content:center;}
.convo-row{ display:flex; gap:12px; align-items:center; padding:13px 20px; border-bottom:var(--border-w) solid var(--line); cursor:pointer;}
.avatar{ flex:0 0 auto; width:44px; height:44px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-family:'Lora',serif; font-weight:600; font-size:15px;}
.avatar.group{ background:var(--amber-soft); color:var(--amber); }
.convo-main{ flex:1; min-width:0; }
.convo-top{ display:flex; justify-content:space-between; gap:8px; }
.convo-top .name{ font-weight:600; font-size:14.5px; }
.convo-top .time{ font-size:11.5px; color:var(--muted); flex:0 0 auto; }
.convo-preview{ font-size:13px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; margin-top:2px;}
.convo-preview span.txt{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.unread-badge{ min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:var(--wax); color:#fff; font-size:11.5px; font-weight:600; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}

.thread-header{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:var(--border-w) solid var(--line); flex:0 0 auto;}
.thread-header .name{ font-weight:600; font-size:15px; flex:1;}
.pinned-paper{ margin:12px 16px; padding:12px 13px; background:var(--paper-2); border:var(--border-w) solid var(--line); border-radius:9px; cursor:pointer;}
.pinned-paper h4{ font-family:'Lora',serif; font-size:14.5px; margin:0 0 4px; font-weight:600; }
.pinned-paper .meta{ font-size:11.5px; color:var(--muted); }
.messages-body{ flex:1; padding:6px 16px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; min-height:0;}
.bubble{ max-width:78%; padding:9px 13px; border-radius:14px; font-size:14px; line-height:1.4;}
.bubble.them{ align-self:flex-start; background:var(--paper-2); border:var(--border-w) solid var(--line); border-bottom-left-radius:4px;}
.bubble.me{ align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px;}
.bubble .author{ font-size:11px; opacity:.65; display:block; margin-bottom:2px; }
.bubble .attach{ margin-top:6px; padding:8px 10px; border-radius:8px; background:rgba(255,255,255,.5); font-size:12.5px; cursor:pointer;}
.bubble.me .attach{ background:rgba(255,255,255,.16); }
.composer{ flex:0 0 auto; display:flex; gap:8px; padding:10px 14px; border-top:var(--border-w) solid var(--line);}
.composer input{ flex:1; border:var(--border-w) solid var(--line); border-radius:100px; padding:10px 15px; font-size:14px; background:var(--paper-2); color:var(--ink);}
.composer input:focus{ outline:2px solid var(--accent); outline-offset:1px;}
.composer button{ width:40px; height:40px; border-radius:50%; border:none; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;}

/* ---------- profile ---------- */
.profile-greet{ padding:26px 20px 18px; display:flex; align-items:center; gap:14px; border-bottom:var(--border-w) solid var(--line);}
.profile-greet .avatar{ width:56px; height:56px; font-size:19px;}
.profile-greet h2{ font-family:'Lora',serif; font-size:21px; margin:0; }
.profile-greet .sub{ font-size:12.5px; color:var(--muted); margin-top:2px;}
.settings-list{ padding:6px 0 22px; }
.setting-row{ display:flex; align-items:center; justify-content:space-between; padding:17px 20px; border-bottom:var(--border-w) solid var(--line); cursor:pointer;}
.setting-row .label{ font-size:15px; }
.setting-row .value{ font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px;}
.setting-row .value#interests-value{ font-size:11px; max-width:150px; line-height:1.35; text-align:right; justify-content:flex-end; }
.setting-row.danger .label{ color:var(--wax); }

/* ---------- reader ---------- */
#reader{ position:absolute; inset:0; background:var(--paper); z-index:20; display:flex; flex-direction:column; transform:translateY(100%); transition:transform .32s cubic-bezier(.2,.7,.3,1); color:var(--ink);}
#reader.open{ transform:translateY(0); }
.reader-header{ flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:14px 10px; border-bottom:var(--border-w) solid var(--line);}
.reader-header .rback{ width:36px; height:36px; border:none; background:none; color:var(--ink); display:flex; align-items:center; justify-content:center;}
.reader-header .rtitle{ flex:1; font-family:'Lora',serif; font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:4px;}
.rbtn{ width:38px; height:38px; border:none; background:none; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; border-radius:8px;}
.rbtn.active{ color:var(--accent); background:var(--accent-soft); }
.reader-body{ flex:1; overflow-y:auto; padding:22px 24px 40px; font-family:'Lora',serif; font-size:var(--reader-font); line-height:1.65; background:var(--paper); color:var(--ink);}
.reader-body.theme-sepia{ background:#f2e8d3; color:#3a2f1f; }
.reader-body.theme-oscuro{ background:#1c1c18; color:#e8e3d4; }
.reader-body h1{ font-size:calc(var(--reader-font) + 8px); line-height:1.3; margin:0 0 8px;}
.reader-body .meta-line{ font-family:'IBM Plex Sans',sans-serif; font-size:13px; color:var(--muted); margin-bottom:2px;}
.reader-body .meta-line.mono{ font-family:'IBM Plex Mono',monospace; font-size:12px; }
.reader-body .translated-chip{ display:inline-flex; align-items:center; gap:6px; margin:14px 0; padding:6px 12px; border-radius:100px; background:var(--accent-soft); color:var(--accent); font-family:'IBM Plex Sans',sans-serif; font-size:12px; cursor:pointer; border:var(--border-w) solid var(--line);}
.reader-body .kw-row{ margin:12px 0 18px; }
.reader-body p{ margin:0 0 16px; }
.reader-body .abstract-label{ font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:12px; color:var(--accent); margin-bottom:6px;}

/* ---------- sheet ---------- */
.sheet-backdrop{ position:absolute; inset:0; background:rgba(20,18,12,.4); z-index:29; opacity:0; pointer-events:none; transition:opacity .25s;}
.sheet-backdrop.show{ opacity:1; pointer-events:auto; }
#sheet{ position:absolute; left:0; right:0; bottom:0; background:var(--paper); z-index:30; border-radius:18px 18px 0 0; transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.7,.3,1); max-height:82%; display:flex; flex-direction:column; box-shadow:0 -12px 30px rgba(0,0,0,.18); color:var(--ink);}
#sheet.show{ transform:translateY(0); }
.sheet-handle{ width:38px; height:4px; background:var(--line); border-radius:4px; margin:10px auto 4px; flex:0 0 auto;}
.sheet-head{ display:flex; align-items:center; justify-content:space-between; padding:6px 18px 12px; border-bottom:var(--border-w) solid var(--line); flex:0 0 auto;}
.sheet-head h3{ font-family:'Lora',serif; font-size:17px; margin:0; }
.sheet-sub{ font-size:12.5px; color:var(--muted); padding:0 18px 8px; margin-top:-6px;}
.sheet-close{ width:30px; height:30px; border:none; background:none; color:var(--muted);}
.sheet-body{ padding:8px 18px 16px; overflow-y:auto; }
.sheet-foot{ padding:12px 18px 18px; border-top:var(--border-w) solid var(--line); flex:0 0 auto;}
.btn-primary{ width:100%; padding:13px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; font-size:14.5px;}
.btn-primary:disabled{ opacity:.4; }
.text-input{ width:100%; border:var(--border-w) solid var(--line); border-radius:9px; padding:11px 13px; font-size:14.5px; background:var(--paper-2); color:var(--ink);}

.seg-row{ display:flex; gap:8px; margin-bottom:18px;}
.seg-btn{ flex:1; padding:10px; border-radius:9px; border:var(--border-w) solid var(--line); background:var(--paper); font-size:13.5px; color:var(--ink-soft);}
.seg-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent);}
.slider-label{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-bottom:6px;}
input[type=range]{ width:100%; accent-color:var(--accent); }

.pick-row{ display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:var(--border-w) solid var(--line); cursor:pointer; text-decoration:none; color:inherit; background:none; width:100%; border-left:none; border-right:none; border-top:none;}
.pick-row .avatar{ width:38px; height:38px; font-size:13px;}
.pick-row .ico{ width:38px; height:38px; border-radius:9px; background:var(--paper-2); border:var(--border-w) solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex:0 0 auto;}
.pick-row .info{ flex:1;}
.pick-row .info .n{ font-size:14px; font-weight:500;}
.pick-row .info .s{ font-size:12px; color:var(--muted);}
.pick-row .check{ width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; color:transparent; flex:0 0 auto;}
.pick-row.selected .check{ background:var(--accent); border-color:var(--accent); color:#fff;}
.pick-row.folder .check svg{ width:13px; height:13px; }
.share-comment{ margin-top:10px; width:100%; border:var(--border-w) solid var(--line); border-radius:9px; padding:10px 12px; font-size:13.5px; resize:none; background:var(--paper-2); color:var(--ink);}
.lang-group-title{ font-size:11.5px; font-weight:600; color:var(--accent); text-transform:none; margin:14px 4px 6px;}
.lang-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:var(--border-w) solid var(--line); cursor:pointer; font-size:14.5px;}
.lang-row .check{ color:var(--accent); opacity:0; }
.lang-row.selected .check{ opacity:1; }
.interest-chip{ padding:8px 14px; border-radius:100px; border:var(--border-w) solid var(--line); font-size:13px; cursor:pointer; color:var(--ink-soft); background:var(--paper);}
.interest-chip.selected{ background:var(--accent); border-color:var(--accent); color:#fff;}
.interest-wrap{ display:flex; flex-wrap:wrap; gap:8px;}
.theme-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 4px; border-bottom:var(--border-w) solid var(--line); cursor:pointer;}
.theme-row .swatch{ width:34px; height:34px; border-radius:8px; border:var(--border-w) solid var(--line); flex:0 0 auto;}

#toast{ position:absolute; left:20px; right:20px; bottom:78px; background:var(--ink); color:var(--paper); padding:12px 16px; border-radius:10px; font-size:13.5px; text-align:center; z-index:40; transform:translateY(20px); opacity:0; transition:all .25s; pointer-events:none;}
#toast.show{ transform:translateY(0); opacity:1; }

      <div class="screen-title">Biblioteca</div>

        <div class="sub" id="profile-sub"></div>

      <div class="setting-row danger" id="row-logout"><div class="label">Cierre de sesión</div></div>

const papers = [
{ id:'p1', section:'Bioinformática', citedBy:128,
  title:{es:'Redes neuronales de grafos para la predicción de estructuras de proteínas', en:'Graph neural networks for protein structure prediction'},
  authors:'L. Chen, N. Okafor, R. Martins', doi:'10.1101/2025.11.02.598877',
  keywords:['GNN','proteínas','aprendizaje profundo'],
  abstract:{es:'Presentamos una arquitectura de redes neuronales de grafos que representa cada residuo como un nodo y cada contacto espacial como una arista, mejorando la predicción de plegamiento en proteínas de secuencia corta. El modelo reduce el error de distancia media en un 14% frente a métodos basados en atención pura, con un costo computacional razonable para flujos de laboratorio.',
             en:'We introduce a graph neural network architecture that represents each residue as a node and each spatial contact as an edge, improving folding prediction for short-sequence proteins. The model reduces mean distance error by 14% compared to pure attention-based methods, while keeping computational cost reasonable for lab workflows.'},
  content:{
    es:['Introducción — La predicción de estructura proteica a partir de la secuencia sigue siendo uno de los problemas centrales de la biología computacional. Los métodos recientes basados en atención capturan relaciones de largo alcance, pero suelen ignorar la geometría local de los contactos entre residuos.',
        'Métodos — Construimos un grafo por proteína donde cada nodo corresponde a un residuo y cada arista codifica la distancia y el ángulo diedro con sus vecinos espaciales. Entrenamos el modelo sobre 12.000 estructuras de bancos públicos, con validación cruzada por familia de plegamiento.',
        'Resultados — El modelo alcanza un error de distancia media de 1.8 Å en el conjunto de prueba, un 14% menor que la línea base de atención pura, con mejoras más marcadas en dominios de menos de 120 residuos.',
        'Discusión — Combinar señales geométricas locales con atención global puede ser más eficiente que depender de una sola. Queda evaluar el modelo en proteínas de membrana, subrepresentadas en el conjunto de entrenamiento actual.'],
    en:['Introduction — Predicting protein structure from sequence remains one of the central problems in computational biology. Recent attention-based methods capture long-range relationships but often ignore the local geometry of residue contacts.',

{ id:'p2', section:'Neurociencia', citedBy:342,
  title:{es:'Plasticidad sináptica y consolidación de la memoria durante el sueño REM', en:'Synaptic plasticity and memory consolidation during REM sleep'},

  keywords:['sueño REM','plasticidad sináptica','hipocampo'],
  abstract:{es:'Mediante registros electrofisiológicos en modelo murino, mostramos que la fase REM favorece el fortalecimiento selectivo de sinapsis hipocampales reclutadas durante el aprendizaje previo, mientras que las conexiones no relacionadas con la tarea tienden a debilitarse.',

  content:{
    es:['Introducción — El papel del sueño REM en la consolidación de la memoria ha sido debatido por décadas, en parte por la dificultad de registrar actividad sináptica específica sin alterarla.',
        'Métodos — Registramos potenciales de campo en el hipocampo de ratones durante tareas de reconocimiento espacial y durante el sueño posterior, distinguiendo fases REM y no-REM por electroencefalografía.',
        'Resultados — Observamos un aumento del 22% en la amplitud de potenciales postsinápticos en sinapsis activas durante la tarea, específicamente en episodios REM, sin cambios equivalentes en sinapsis no relacionadas.',
        'Discusión — Los hallazgos apoyan un mecanismo de etiquetado sináptico selectivo durante REM, aunque se necesitan más estudios para saber si el efecto se generaliza a tareas no espaciales.'],
    en:['Introduction — The role of REM sleep in memory consolidation has been debated for decades, partly due to the difficulty of recording synapse-specific activity without disrupting it.',
        'Methods — We recorded hippocampal field potentials in mice during spatial recognition tasks and subsequent sleep, distinguishing REM and non-REM phases via EEG.',
        'Results — We observed a 22% increase in postsynaptic potential amplitude at task-active synapses, specifically during REM episodes, with no equivalent change elsewhere.',
        'Discussion — Findings support a selective synaptic tagging mechanism during REM, though further studies are needed to see if the effect generalizes to non-spatial tasks.']

{ id:'p3', section:'Aprendizaje automático', citedBy:57,
  title:{es:'Un límite superior más ajustado para la complejidad de muestra en aprendizaje por refuerzo offline', en:'A tighter sample complexity bound for offline reinforcement learning'},
  authors:'T. Ibarra, S. Wren', doi:'10.48550/arXiv.2026.03291',
  keywords:['RL offline','complejidad de muestra','teoría'],
  abstract:{es:'Derivamos un límite superior más ajustado para la complejidad de muestra en aprendizaje por refuerzo offline bajo cobertura parcial del conjunto de datos, mejorando en un factor logarítmico los resultados previos para políticas casi óptimas.',
             en:'We derive a tighter sample complexity bound for offline reinforcement learning under partial data coverage, improving prior results for near-optimal policies by a logarithmic factor.'},
  content:{
    es:['Introducción — El aprendizaje por refuerzo offline promete aprovechar registros históricos sin interacción en línea, pero sus garantías dependen de cuán bien el conjunto de datos cubre el espacio de estados.',

  keywords:['microbiota','inmunidad innata','intestino'],
  abstract:{es:'Caracterizamos cómo tres especies bacterianas comensales modulan la producción de citoquinas por macrófagos intestinales, proponiendo un mecanismo dependiente de metabolitos de cadena corta que podría explicar diferencias individuales en la respuesta a infecciones entéricas.',

        'Métodos — Colonizamos ratones libres de gérmenes con combinaciones definidas de tres especies comensales y medimos citoquinas de macrófagos intestinales tras un desafío con patógenos entéricos.',
        'Resultados — La combinación de las tres especies redujo la producción de citoquinas proinflamatorias en un 35% frente a ratones monocolonizados, efecto que se perdió al inhibir ácidos grasos de cadena corta.',

    en:['Introduction — Gut microbiota composition varies widely across individuals, and much of that variation may explain differences in enteric infection susceptibility.',
        'Methods — We colonized germ-free mice with defined combinations of three commensal species and measured intestinal macrophage cytokines after an enteric pathogen challenge.',
        'Results — The three-species combination reduced pro-inflammatory cytokine production by 35% vs. mono-colonized mice, an effect lost when short-chain fatty acid synthesis was inhibited.',

{ id:'p5', section:'Astrofísica', citedBy:189,
  title:{es:'Detección de exoplanetas mediante fotometría de tránsito con redes convolucionales', en:'Exoplanet detection via transit photometry using convolutional networks'},
  authors:'D. Vidal, K. Nakamura', doi:'10.3847/AJ.2026.0087',
  keywords:['exoplanetas','fotometría','redes convolucionales'],
  abstract:{es:'Entrenamos una red convolucional 1D sobre curvas de luz de misiones de tránsito para distinguir señales planetarias de falsos positivos astrofísicos, alcanzando una precisión comparable a clasificadores humanos expertos con un tiempo de procesamiento 200 veces menor.',
             en:'We train a 1D convolutional network on transit-mission light curves to distinguish planetary signals from astrophysical false positives, reaching accuracy comparable to expert humans with 200x less processing time.'},

  }},
{ id:'p6', section:'Genética', citedBy:96,
  title:{es:'Edición génica CRISPR-Cas9 en modelos de fibrosis quística: avances y limitaciones', en:'CRISPR-Cas9 gene editing in cystic fibrosis models: advances and limitations'},
  authors:'F. Correa, N. Okafor', doi:'10.1038/s41591-2026-0341',
  keywords:['CRISPR','fibrosis quística','edición génica'],
  abstract:{es:'Evaluamos la eficiencia y especificidad de la edición CRISPR-Cas9 dirigida a la mutación ΔF508 del gen CFTR en organoides intestinales derivados de pacientes, reportando corrección funcional en el 41% de las células editadas sin eventos de edición fuera de blanco detectables.',

/* ================= HOME DECK ================= */
let deckIndex = 0;
const IDLE_NUDGE_MS = 10000;
let idleNudgeTimer = null;
function idleNudgeAllowed(){
  return currentTab==='home'
    && !document.getElementById('reader').classList.contains('open')
    && !document.getElementById('sheet').classList.contains('show');
}
function resetIdleNudge(){
  clearTimeout(idleNudgeTimer);
  if(!idleNudgeAllowed()) return;
  idleNudgeTimer = setTimeout(triggerIdleNudge, IDLE_NUDGE_MS);
}
function triggerIdleNudge(){
  if(!idleNudgeAllowed()) return;
  const card = document.querySelector('#deck .card:last-child');
  if(!card) return;
  card.classList.add('idle-nudge');
  card.addEventListener('animationend', function onEnd(){
    card.classList.remove('idle-nudge');
    card.removeEventListener('animationend', onEnd);
    resetIdleNudge();
  });
}
function renderDeck(){
  const deck = document.getElementById('deck');
  deck.innerHTML = '';
  const visible = papers.slice(deckIndex, deckIndex+3);
  visible.slice().reverse().forEach((p, revIdx)=>{
    const depth = visible.length-1-revIdx;
    const card = document.createElement('div');
    card.className='card';
    card.style.transform = `translateY(${depth*8}px) scale(${1-depth*0.035})`;
    card.style.zIndex = 10-depth;
    card.style.opacity = depth>1? '0.6':'1';
    const st = userState[p.id];
    const isSaved = st.folders.size>0;
    card.innerHTML = `
      <div class="perf"></div>
      <div class="card-scroll">
        <div class="section-label">${p.section}</div>
        <h2>${p.title.es}</h2>
        <div class="authors">${p.authors}</div>
        <div class="doi">DOI ${p.doi}</div>
        <div class="cited">Citado ${p.citedBy} veces</div>
        <div class="kw-row">${p.keywords.map(k=>`<span class="kw">${k}</span>`).join('')}</div>
        <div class="abstract">${p.abstract.es}</div>
      </div>
      <div class="card-footer">
        <button class="icon-btn heart ${isSaved?'active':''}" data-act="save">${icon('heart')}</button>
        <button class="icon-btn" data-act="share">${icon('share')}</button>
      </div>`;
    if(depth===0){
      wireCardGestures(card, p.id);
      card.querySelector('[data-act="save"]').addEventListener('click', e=>{ e.stopPropagation(); resetIdleNudge(); openFolderSheet(p.id); });
      card.querySelector('[data-act="share"]').addEventListener('click', e=>{ e.stopPropagation(); resetIdleNudge(); openShareSheet(p.id); });
      card.addEventListener('click', ()=>{ if(card.dataset.dragged==='1'){ card.dataset.dragged=''; return; } openReader(p.id); });
    }
    deck.appendChild(card);
  });
  document.getElementById('deck-counter').textContent = `${deckIndex+1} / ${papers.length}`;
  document.getElementById('deck-prev').disabled = deckIndex===0;
  document.getElementById('deck-next').disabled = deckIndex>=papers.length-1;
}
function wireCardGestures(card){
  let startX=0, startY=0, dx=0, dragging=false, decided=false, horizontal=false;
  const THRESHOLD = 70;
  card.addEventListener('pointerdown', e=>{
    dragging=true; decided=false; horizontal=false; dx=0;
    startX=e.clientX; startY=e.clientY;
    card.style.transition='none';
    card.classList.remove('idle-nudge');
    card.dataset.dragged='';
    resetIdleNudge();
  });
  card.addEventListener('pointermove', e=>{
    if(!dragging) return;
    dx = e.clientX-startX; const dy = e.clientY-startY;
    if(!decided && (Math.abs(dx)>6 || Math.abs(dy)>6)){
      decided = true; horizontal = Math.abs(dx) > Math.abs(dy);
      if(horizontal){ try{ card.setPointerCapture(e.pointerId); }catch(err){} }
    }
    if(horizontal){
      card.dataset.dragged='1';
      card.style.transform = 'translateX('+dx+'px) rotate('+(dx/24)+'deg)';
    }
  });
  function endDrag(){
    if(!dragging) return; dragging=false;
    const moved = dx;
    dx=0;
    // Izquierda = siguiente paper, derecha = anterior (igual que las flechas)
    if(horizontal && moved < -THRESHOLD && deckIndex < papers.length-1){
      card.style.transition='transform .2s ease-in';
      card.style.transform='translateX(-120%) rotate(-12deg)';
      setTimeout(()=>{ deckIndex++; renderDeck(); }, 180);
    } else if(horizontal && moved > THRESHOLD && deckIndex > 0){
      card.style.transition='transform .2s ease-in';
      card.style.transform='translateX(120%) rotate(12deg)';
      setTimeout(()=>{ deckIndex--; renderDeck(); }, 180);
    } else {
      card.style.transition='transform .25s cubic-bezier(.2,.7,.3,1)';
      card.style.transform='';
    }
    resetIdleNudge();
  }
  card.addEventListener('pointerup', endDrag);
  card.addEventListener('pointercancel', endDrag);
}
document.getElementById('deck-prev').addEventListener('click', ()=>{ if(deckIndex>0){ deckIndex--; renderDeck(); } resetIdleNudge(); });
document.getElementById('deck-next').addEventListener('click', ()=>{ if(deckIndex<papers.length-1){ deckIndex++; renderDeck(); } resetIdleNudge(); });
document.getElementById('deck-prev').innerHTML = icon('prev');
document.getElementById('deck-next').innerHTML = icon('next');

    title:'Guardar en tu biblioteca',
    sub:'Elige una o más carpetas. Toca de nuevo para quitarlo.',
    bodyHtml: folderRowsHtml(paperId, true)
  });
  wireFolderRows(paperId);
}
function wireFolderRows(paperId){
  document.querySelectorAll('#sheet-body .pick-row.folder').forEach(row=>{
    row.addEventListener('click', ()=>{
      const fid = row.dataset.folder;
      const st = userState[paperId];
      if(st.folders.has(fid)){ st.folders.delete(fid); row.classList.remove('selected'); toast('Se quitó de '+folders.find(f=>f.id===fid).name); }
      else { st.folders.add(fid); row.classList.add('selected'); toast('Guardado en '+folders.find(f=>f.id===fid).name); }
      renderDeck(); updateTabDots();
    });
  });
  const addRow = document.getElementById('add-folder-row');
  if(addRow) addRow.addEventListener('click', ()=> openCreateFolderSheet(paperId));
}

  openSheet({
    title:'Nueva carpeta', bodyHtml: body, footerText:'Crear',
    onConfirm:()=>{

      if(!name){ toast('Ponle un nombre a la carpeta'); return; }

let shareSelection = new Set();
function openShareContactsSheet(paperId){
  shareSelection = new Set();
  const body = `
    <div id="share-contacts">
      ${contacts.map(c=>`
        <div class="pick-row" data-id="${c.id}">
          <div class="avatar ${c.kind==='group'?'group':''}">${initials(c.name)}</div>
          <div class="info"><div class="n">${c.name}</div><div class="s">${c.sub}</div></div>
          <div class="check">${icon('check')}</div>
        </div>`).join('')}
    </div>
    <textarea class="share-comment" id="share-comment" rows="2" placeholder="Añade un comentario (opcional)"></textarea>`;
  openSheet({
    title:'Enviar por mensajería de Lab', bodyHtml: body, footerText:'Enviar',
    onConfirm:()=>{
      if(shareSelection.size===0){ toast('Elige al menos un destinatario'); return; }
      const comment = document.getElementById('share-comment').value.trim();
      shareSelection.forEach(cid=> shareToContact(paperId, cid, comment));
      closeSheet();
      toast('Compartido con '+Array.from(shareSelection).map(id=>contactById(id).name).join(', '));
    }
  });
  document.querySelectorAll('#share-contacts .pick-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const id = row.dataset.id;
      if(shareSelection.has(id)){ shareSelection.delete(id); row.classList.remove('selected'); }
      else { shareSelection.add(id); row.classList.add('selected'); }
    });
  });
}
function shareToContact(paperId, contactId, comment){
  let conv = conversations.find(c=> c.participantIds.length===1 && c.participantIds[0]===contactId);
  if(!conv){
    conv = { id:'c'+Date.now()+Math.random().toString(36).slice(2,5), participantIds:[contactId], pinnedPaperId:paperId, time:'ahora', unreadCount:0, messages:[] };
    conversations.unshift(conv);
  } else {
    if(!conv.pinnedPaperId) conv.pinnedPaperId = paperId;
    conv.time='ahora';
    conversations = conversations.filter(c=>c.id!==conv.id);
    conversations.unshift(conv);
  }
  conv.messages.push({authorId:ME, text:comment||undefined, attachedPaperId:paperId});
  updateTabDots();
}

/* ================= SOCIAL FEED (compartido vía Cloudflare D1) ================= */
// Los posts, likes y contadores viven en una base de datos compartida (ver SETUP-SOCIAL-DB.md).
// Todo lo demás de la app (Home, Biblioteca, Perfil) sigue siendo estado local del navegador.
let socialPosts = [];
let socialLoadFailed = false;

function getDeviceId(){
  try{
    let id = localStorage.getItem('lab_device_id');
    if(!id){
      id = 'd_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('lab_device_id', id);
    }
    return id;
  } catch(e){
    // Navegación privada / storage bloqueado: id efímero solo para esta carga de página.
    if(!getDeviceId._fallback){
      getDeviceId._fallback = 'd_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }
    return getDeviceId._fallback;
  }
}

async function fetchSocialPosts(){
  const res = await fetch('/api/social/posts?device=' + encodeURIComponent(getDeviceId()));
  if(!res.ok) throw new Error('network');
  const data = await res.json();
  return data.posts;
}
async function loadAndRenderSocialFeed(){
  const wrap = document.getElementById('social-feed');
  wrap.innerHTML = `<div class="empty-state">Cargando publicaciones…</div>`;
  socialLoadFailed = false;
  try{
    socialPosts = await fetchSocialPosts();
  } catch(e){
    socialLoadFailed = true;
  }
  renderSocialFeed();
}
function renderSocialFeed(){
  const wrap = document.getElementById('social-feed');
  if(socialLoadFailed){
    wrap.innerHTML = `<div class="empty-state">No se pudo cargar el feed compartido. Revisa la conexión a la base de datos (ver SETUP-SOCIAL-DB.md) e inténtalo de nuevo.</div>`;
    return;
  }
  if(socialPosts.length===0){
    wrap.innerHTML = `<div class="empty-state">Todavía no hay publicaciones. Sé el primero en comentar un paper.</div>`;
    return;
  }
  wrap.innerHTML = socialPosts.map(post=>{
    const paper = post.paperId ? papers.find(p=>p.id===post.paperId) : null;
    let quotedHtml = '';
    if(post.quotedPostId){
      const qp = socialPosts.find(x=>x.id===post.quotedPostId);
      if(qp){ quotedHtml = `<div class="post-quoted"><b>${qp.authorName}:</b> ${qp.text}</div>`; }
    }
    return `<div class="post-card" data-id="${post.id}">
      <div class="post-head">
        <div class="avatar">${initials(post.authorName)}</div>
        <div class="post-author"><div class="n">${post.authorName}</div><div class="s">${post.authorSub||''}</div></div>
      </div>
      <div class="post-text">${post.text}</div>
      ${quotedHtml}
      ${paper? `<div class="post-paper" data-pid="${paper.id}"><div class="pp-label">${paper.section}</div><h4>${paper.title.es}</h4><div class="pp-meta">${paper.authors}</div></div>` : ''}
      <div class="post-actions">
        <button class="post-act like ${post.likedByMe?'active':''}" data-act="like">${icon('heart')}<span>${post.likes}</span></button>
        <button class="post-act" data-act="reply">${icon('reply')}<span>${post.replies}</span></button>
        <button class="post-act" data-act="quote">${icon('quote')}<span>${post.quotes}</span></button>
      </div>
    </div>`;
  }).join('');
  wrap.querySelectorAll('.post-paper').forEach(el=> el.addEventListener('click', ()=> openReader(el.dataset.pid)));
  wrap.querySelectorAll('.post-card').forEach(card=>{
    const id = card.dataset.id;
    card.querySelector('[data-act="like"]').addEventListener('click', ()=> toggleLikePost(id));
    card.querySelector('[data-act="reply"]').addEventListener('click', ()=> openReplySheet(id));
    card.querySelector('[data-act="quote"]').addEventListener('click', ()=> openQuoteSheet(id));
  });
}
async function toggleLikePost(id){
  const post = socialPosts.find(p=>p.id===id);
  if(!post) return;
  const prevLiked = post.likedByMe, prevLikes = post.likes;
  post.likedByMe = !post.likedByMe;
  post.likes += post.likedByMe? 1 : -1;
  renderSocialFeed();
  try{
    const res = await fetch(`/api/social/posts/${id}/like`, {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ deviceId: getDeviceId() })
    });
    if(!res.ok) throw new Error('network');
    const data = await res.json();
    post.likes = data.likes; post.likedByMe = data.likedByMe;
    renderSocialFeed();
  } catch(e){
    post.likedByMe = prevLiked; post.likes = prevLikes;
    renderSocialFeed();
    toast('No se pudo guardar el "me gusta"');
  }
}
function openReplySheet(id){
  const post = socialPosts.find(p=>p.id===id);
  const body = `<textarea class="share-comment" id="reply-text" rows="3" placeholder="Escribe tu respuesta…"></textarea>`;
  openSheet({ title:'Responder', bodyHtml: body, footerText:'Publicar respuesta',
    onConfirm: async ()=>{
      const val = document.getElementById('reply-text').value.trim();
      if(!val){ toast('Escribe algo para responder'); return; }
      try{
        const res = await fetch(`/api/social/posts/${id}/reply`, { method:'POST' });
        if(!res.ok) throw new Error('network');
        const data = await res.json();
        post.replies = data.replies;
        closeSheet(); renderSocialFeed();
        toast('Respuesta publicada');
      } catch(e){
        closeSheet();
        toast('No se pudo publicar la respuesta');
      }
    }});
}
function openQuoteSheet(id){
  const post = socialPosts.find(p=>p.id===id);
  const body = `
    <div class="pinned-paper" style="margin:0 0 12px; cursor:default;"><h4>${post.authorName}</h4><div class="meta">${post.text}</div></div>
    <textarea class="share-comment" id="quote-text" rows="3" placeholder="Añade tu comentario…"></textarea>`;
  openSheet({ title:'Citar publicación', bodyHtml: body, footerText:'Publicar cita',
    onConfirm: async ()=>{
      const val = document.getElementById('quote-text').value.trim();
      if(!val){ toast('Añade un comentario para citar'); return; }
      try{
        const res = await fetch('/api/social/posts', {
          method:'POST', headers:{'content-type':'application/json'},
          body: JSON.stringify({
            text: val, paperId: post.paperId||null, quotedPostId: post.id,
            authorName: session.name, authorSub: session.affiliation
          })
        });
        if(!res.ok) throw new Error('network');
        closeSheet();
        toast('Publicaste una cita');
        loadAndRenderSocialFeed();
      } catch(e){
        closeSheet();
        toast('No se pudo publicar la cita');
      }
    }});
}

/* ================= DMs (acceso directo) ================= */
document.getElementById('btn-dm').innerHTML = icon('send')+'<span class="dm-badge" id="dm-badge"></span>';
document.getElementById('btn-dm').addEventListener('click', openDMInbox);
function openDMInbox(){
  let body;
  if(conversations.length===0){
    body = `<div class="empty-state">Todavía no tienes conversaciones. Comparte un paper desde el Home para iniciar una.</div>`;
  } else {
    body = conversations.map(conv=>{
      const c = contactById(conv.participantIds[0]);
      const last = conv.messages[conv.messages.length-1];
      let preview = '';
      if(last){
        if(last.text) preview = (last.authorId===ME? 'Tú: ':'') + last.text;
        else if(last.attachedPaperId){ const p = papers.find(pp=>pp.id===last.attachedPaperId); preview = 'Compartió: «'+(p?p.title.es:'')+'»'; }
      }
      return `<div class="pick-row" data-conv="${conv.id}">
        <div class="avatar ${c.kind==='group'?'group':''}">${initials(c.name)}</div>
        <div class="info"><div class="n">${c.name}</div><div class="s">${preview}</div></div>
        ${conv.unreadCount>0? `<div class="unread-badge">${conv.unreadCount}</div>`:''}
      </div>`;
    }).join('');
  }
  openSheet({ title:'Mensajes', sub:'Tu mensajería privada', bodyHtml: body, footerText:'Nueva conversación',
    onConfirm: openNewConvoPicker });
  document.querySelectorAll('#sheet-body .pick-row[data-conv]').forEach(row=>{
    row.addEventListener('click', ()=>{ closeSheet(); openThread(row.dataset.conv); });
  });
}
function openNewConvoPicker(){
  let picked = null;
  const body = contacts.map(c=>`
    <div class="pick-row" data-id="${c.id}">
      <div class="avatar ${c.kind==='group'?'group':''}">${initials(c.name)}</div>
      <div class="info"><div class="n">${c.name}</div><div class="s">${c.sub}</div></div>
      <div class="check">${icon('check')}</div>
    </div>`).join('');
  openSheet({
    title:'Nueva conversación', bodyHtml:body, footerText:'Iniciar',
    onConfirm:()=>{
      if(!picked){ toast('Elige un contacto'); return; }
      let conv = conversations.find(c=> c.participantIds.length===1 && c.participantIds[0]===picked);
      if(!conv){ conv = { id:'c'+Date.now(), participantIds:[picked], pinnedPaperId:null, time:'ahora', unreadCount:0, messages:[] }; conversations.unshift(conv); }
      closeSheet(); openThread(conv.id);
    }
  });
  document.querySelectorAll('#sheet-body .pick-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      document.querySelectorAll('#sheet-body .pick-row').forEach(r=>r.classList.remove('selected'));
      row.classList.add('selected'); picked = row.dataset.id;
    });
  });
}
let openConvId = null;
function openThread(id){
  openConvId = id;
  const conv = conversations.find(c=>c.id===id);
  conv.unreadCount = 0; updateTabDots();
  const c = contactById(conv.participantIds[0]);
  document.getElementById('thread-avatar').className = 'avatar '+(c.kind==='group'?'group':'');
  document.getElementById('thread-avatar').textContent = initials(c.name);
  document.getElementById('thread-name').textContent = c.name;
  renderThreadPinned(conv); renderThreadMessages(conv);
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-thread').classList.add('active');
}
function renderThreadPinned(conv){
  const el = document.getElementById('thread-pinned');
  if(!conv.pinnedPaperId){ el.innerHTML=''; return; }
  const p = papers.find(pp=>pp.id===conv.pinnedPaperId);
  el.innerHTML = `<div class="pinned-paper" id="pinned-open"><h4>${p.title.es}</h4><div class="meta">${p.authors} · DOI ${p.doi}</div></div>`;
  document.getElementById('pinned-open').addEventListener('click', ()=> openReader(p.id));
}
function renderThreadMessages(conv){
  const el = document.getElementById('thread-messages');
  el.innerHTML = conv.messages.map(m=>{
    const mine = m.authorId===ME;
    const authorName = mine? '' : (contactById(conv.participantIds[0]).kind==='group'? contactById(conv.participantIds[0]).name : '');
    let attach = '';
    if(m.attachedPaperId){ const p = papers.find(pp=>pp.id===m.attachedPaperId); attach = `<div class="attach" data-pid="${p.id}">📄 ${p.title.es}</div>`; }
    return `<div class="bubble ${mine?'me':'them'}">${authorName?`<span class="author">${authorName}</span>`:''}${m.text?m.text:''}${attach}</div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
  el.querySelectorAll('.attach').forEach(a=> a.addEventListener('click', ()=> openReader(a.dataset.pid)));
}
document.getElementById('thread-back').innerHTML = icon('back');
document.getElementById('thread-back').addEventListener('click', ()=> showTab('chat'));
document.getElementById('thread-send').innerHTML = icon('send');
function sendThreadMessage(){
  const input = document.getElementById('thread-input');
  const text = input.value.trim();
  if(!text) return;
  const conv = conversations.find(c=>c.id===openConvId);
  conv.messages.push({authorId:ME, text}); conv.time = 'ahora';
  conversations = conversations.filter(c=>c.id!==conv.id); conversations.unshift(conv);
  input.value=''; renderThreadMessages(conv);
}
document.getElementById('thread-send').addEventListener('click', sendThreadMessage);
document.getElementById('thread-input').addEventListener('keydown', e=>{ if(e.key==='Enter') sendThreadMessage(); });

/* ================= LIBRARY ================= */
let libFilter = 'all';
function renderFolderTabs(){
  const tabs = document.getElementById('folder-tabs');
  const items = [{id:'all', name:'Todo'}].concat(folders);
  tabs.innerHTML = items.map(f=>`<button class="folder-chip ${libFilter===f.id?'active':''}" data-f="${f.id}">${f.name}</button>`).join('')

    btn.addEventListener('click', ()=>{
      if(btn.dataset.f==='__add'){ openCreateFolderSheet(null); return; }
      libFilter = btn.dataset.f; renderLibrary();
    });
  });
}
function renderLibrary(){
  renderFolderTabs();
  const list = document.getElementById('library-list');
  let items = papers.filter(p=>{
    const st = userState[p.id];
    if(libFilter==='all') return st.folders.size>0;
    return st.folders.has(libFilter);
  });
  if(items.length===0){
    const msg = libFilter==='all'
      ? 'Aún no tienes papers en tu biblioteca. Guarda uno desde el Home con el corazón para verlo aquí.'
      : 'Aún no guardaste papers en esta carpeta.';
    list.innerHTML = `<div class="empty-state">${msg}</div>`;
    return;
  }
  list.innerHTML = `<div class="list">`+items.map(p=>{
    const st = userState[p.id];
    return `<div class="row-item" data-id="${p.id}">
      <div class="row-thumb">
        <span class="mono">${p.section.slice(0,3).toUpperCase()}</span>
        ${st.downloaded? `<div class="offline-badge">${icon('download')}</div>` : ''}
      </div>
      <div class="row-body">
        <h3>${p.title.es}</h3>
        <div class="meta">${p.authors}<br><span class="mono">DOI ${p.doi}</span></div>
      </div>
    </div>`;
  }).join('')+`</div>`;
  list.querySelectorAll('.row-item').forEach(row=> row.addEventListener('click', ()=> openReader(row.dataset.id)));
}

let readerPaperId = null;
function openReader(id){
  readerPaperId = id;
  userState[id].read = true;
  const p = papers.find(pp=>pp.id===id);
  document.getElementById('reader-title-mini').textContent = p.title.es;
  document.getElementById('reader-translate').classList.toggle('active', userState[id].translated);
  document.getElementById('reader-download').classList.toggle('active', userState[id].downloaded);
  renderReaderBody();
  document.getElementById('reader').classList.add('open');
  clearTimeout(idleNudgeTimer);
}
function renderReaderBody(){
  const p = papers.find(pp=>pp.id===readerPaperId);
  const st = userState[readerPaperId];
  const lang = st.translated ? 'en' : 'es';
  const body = document.getElementById('reader-body');
  body.className = 'reader-body theme-'+readerStyle.theme;
  const chip = st.translated
    ? `<div class="translated-chip" id="chip-toggle">${icon('translate')} Traducido a ${profile.translationLanguage} · ver original</div>` : '';
  body.innerHTML = `
    <div class="meta-line">${p.section} · Citado ${p.citedBy} veces</div>
    <h1>${p.title[lang]}</h1>
    <div class="meta-line">${p.authors}</div>
    <div class="meta-line mono">DOI ${p.doi}</div>
    <div class="kw-row">${p.keywords.map(k=>`<span class="kw">${k}</span>`).join('')}</div>
    ${chip}
    <div class="abstract-label">Abstract</div>
    <p>${p.abstract[lang]}</p>
    ${p.content[lang].map(par=>`<p>${par}</p>`).join('')}
  `;
  if(st.translated){
    document.getElementById('chip-toggle').addEventListener('click', ()=>{
      userState[readerPaperId].translated = false;
      document.getElementById('reader-translate').classList.remove('active');
      renderReaderBody();
    });
  }
}
document.getElementById('reader-back').innerHTML = icon('back');
document.getElementById('reader-back').addEventListener('click', ()=>{
  document.getElementById('reader').classList.remove('open'); updateTabDots();
  resetIdleNudge();

document.getElementById('reader-translate').innerHTML = icon('translate');
document.getElementById('reader-translate').addEventListener('click', ()=>{
  const st = userState[readerPaperId]; st.translated = !st.translated;
  document.getElementById('reader-translate').classList.toggle('active', st.translated);
  renderReaderBody();
  if(st.translated) toast('Traducido a '+profile.translationLanguage);
});
function downloadPaperPDF(id){
  const p = papers.find(pp=>pp.id===id);
  const st = userState[id];
  const lang = st.translated ? 'en' : 'es';
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const marginX = 56;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const maxW = pageW - marginX*2;
  let y = 64;

  function ensureSpace(lineHeight){
    if(y + lineHeight > pageH - 56){ doc.addPage(); y = 64; }
  }
  function writeLines(text, size, opts){
    opts = opts || {};
    doc.setFont(opts.font || 'helvetica', opts.style || 'normal');
    doc.setFontSize(size);
    const lines = doc.splitTextToSize(text, maxW);
    lines.forEach(line=>{
      ensureSpace(size*1.4);
      doc.text(line, marginX, y);
      y += size*1.4;
    });
  }

  writeLines(p.section.toUpperCase(), 9, { style:'bold' });
  y += 4;
  writeLines(p.title[lang], 18, { style:'bold' });
  y += 2;
  writeLines(p.authors, 11, { style:'italic' });
  writeLines('DOI '+p.doi+'  ·  Citado '+p.citedBy+' veces', 9, { font:'courier' });
  y += 6;
  writeLines(p.keywords.join('  ·  '), 9, { style:'italic' });
  y += 10;
  writeLines('Abstract', 11, { style:'bold' });
  writeLines(p.abstract[lang], 11);
  y += 8;
  p.content[lang].forEach(par=>{ writeLines(par, 11); y += 4; });

  doc.save(p.title[lang].replace(/[^a-z0-9]+/gi,'-').slice(0,60) + '.pdf');
}
document.getElementById('reader-download').innerHTML = icon('download');
document.getElementById('reader-download').addEventListener('click', ()=>{
  const st = userState[readerPaperId]; st.downloaded = !st.downloaded;
  document.getElementById('reader-download').classList.toggle('active', st.downloaded);
  if(st.downloaded){
    downloadPaperPDF(readerPaperId);
    toast('Descargando PDF…');
  } else {
    toast('Ya no está disponible sin conexión');
  }
});
document.getElementById('reader-style').innerHTML = icon('style');
let readerStyle = { theme:'claro', fontSize:17 };
document.getElementById('reader-style').addEventListener('click', ()=>{
  const themes = [['claro','Claro'],['sepia','Sepia'],['oscuro','Oscuro']];
  const body = `
    <div class="seg-row" id="theme-row">${themes.map(t=>`<button class="seg-btn ${readerStyle.theme===t[0]?'active':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
    <div class="slider-label"><span>Tamaño de texto</span><span id="fs-val">${readerStyle.fontSize}px</span></div>
    <input type="range" min="14" max="22" value="${readerStyle.fontSize}" id="fs-range">`;
  openSheet({ title:'Estilo de lectura', bodyHtml: body });
  document.querySelectorAll('#theme-row .seg-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      readerStyle.theme = btn.dataset.t;
      document.querySelectorAll('#theme-row .seg-btn').forEach(b=>b.classList.toggle('active', b===btn));
      renderReaderBody();
    });
  });
  document.getElementById('fs-range').addEventListener('input', e=>{
    readerStyle.fontSize = +e.target.value;
    document.getElementById('fs-val').textContent = readerStyle.fontSize+'px';
    document.documentElement.style.setProperty('--reader-font', readerStyle.fontSize+'px');
  });
});
